<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#100b10">
  <title>BIHTER'İN SON CENAZESİ</title>
</head>

<body>
  <div id="app">

    <canvas id="scene"></canvas>

    <header class="topbar">
      <div class="brand">
        <b>BIHTER'İN SON CENAZESİ</b>
        <small>3D TIKTOK LIVE OYUNU</small>
      </div>

      <div class="live">
        <i></i>
        <span id="liveStatus">SUNUCU BAĞLANIYOR</span>
      </div>
    </header>

    <nav class="route-bar">
      <div class="route-line">
        <div id="routeProgress"></div>
      </div>

      <div class="route-stages">
        <div class="route-stage active">
          <span>01</span>
          <small>SARAY</small>
        </div>

        <div class="route-stage">
          <span>02</span>
          <small>ALAY</small>
        </div>

        <div class="route-stage">
          <span>03</span>
          <small>MEZARLIK</small>
        </div>

        <div class="route-stage">
          <span>04</span>
          <small>DEFİN</small>
        </div>

        <div class="route-stage">
          <span>05</span>
          <small>FİNAL</small>
        </div>
      </div>
    </nav>

    <div class="hud">
      <div class="score-card">
        <small>OYUNCU</small>
        <strong id="playerCount">0</strong>
      </div>

      <div class="score-card">
        <small>SAHNE</small>
        <strong id="stageName">SARAY</strong>
      </div>
    </div>

    <div class="scene-caption">
      Gerçek yol üzerinde cenaze korteji
    </div>

    <aside class="activity" id="activity">
      <p>Prova bekleniyor…</p>
    </aside>

    <div class="bottom">
      <button id="startGame">
        PROVA BİTTİ · OYUNU BAŞLAT
      </button>

      <button id="soundToggle">
        SESİ AÇ
      </button>
    </div>

    <details class="mixer">
      <summary>SES MASASI</summary>

      <label>
        Genel
        <input id="masterVolume" type="range" min="0" max="100" value="80">
      </label>

      <label>
        Yağmur
        <input data-volume="rain" type="range" min="0" max="100" value="24">
      </label>

      <label>
        Rüzgâr
        <input data-volume="wind" type="range" min="0" max="100" value="13">
      </label>

      <label>
        Adım
        <input data-volume="steps" type="range" min="0" max="100" value="18">
      </label>

      <label>
        Tabut
        <input data-volume="coffin" type="range" min="0" max="100" value="12">
      </label>

      <label>
        Müzik
        <input data-volume="music" type="range" min="0" max="100" value="10">
      </label>
    </details>

    <div class="commands">
      KADIN / ERKEK → KATIL · TASIMA · DUA · AGLA · YURU
    </div>

    <section hidden>
      <button data-command="KATIL">KATIL</button>
      <button data-command="KADIN">KADIN</button>
      <button data-command="ERKEK">ERKEK</button>
    </section>

  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
