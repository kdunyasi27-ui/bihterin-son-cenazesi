
services:
  - type: web
    name: bihter-live-bridge
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: TIKTOK_UNIQUE_ID
        sync: false
      - key: FRONTEND_ORIGINS
        value: "*"
